# `.. datatemplate:yaml:: /data/docker-tags/pytorch.yaml`.
#
# Schema shared across docs/data/docker-tags/*.yaml:
#   releases: a list of ROCm releases (newest first), each with a unique
#     `rocm_ver` and a list of `variants` (PyTorch versions). Each variant
#     has a `version` (the display string used in prose and the
#     `pytorch-ver` selector value) and a `tags` map of dimension-key ->
#     Docker tag. PyTorch splits by Python version (`py314` / `py313` /
#     `py312` / `py311` / `py310`); the set of keys present determines
#     which Python tabs render for that variant.
#
#   All PyTorch releases render every "Pull" step first, then a single
#   "Start the Docker container." step with one nested
#   `.. selected:: pytorch-ver=...` per variant, matching how these pages
#   were originally hand-written.
#
#   `version_selector_key` is the `:key:` of this page's `.. selector::`
#   block for the framework-version selector (docs/frameworks/pytorch/
#   install.rst), used to render each variant's `.. selected:: <key>=...`.
#
#   `name` is the display name used in generated prose (for example,
#   "Pull the ROCm <name> <version> Docker image.").
#
#   `layout` ("flat" here) and `dimensions` (the ordered Python-version
#   tab list) are consumed by the shared
#   docs/templates/framework-version-docker.rst.jinja template -- see
#   that file's header comment for what each value means.
