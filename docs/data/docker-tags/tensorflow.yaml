          ub22: "rocm/tensorflow:rocm10.1-ubuntu22.04-py3.12-tf2.21"
      - version: "2.20"
        tags:
          ub24: "rocm/tensorflow:rocm10.1-ubuntu24.04-py3.12-tf2.20"
          ub22: "rocm/tensorflow:rocm10.1-ubuntu22.04-py3.12-tf2.20"

