# Docker pull-tag data for the TensorFlow install guide
# (docs/frameworks/tensorflow/install.rst).
#
# Rendered by docs/templates/tensorflow-docker.rst.jinja via
# `.. datatemplate:yaml:: /data/docker-tags/tensorflow.yaml`.
#
# Schema shared across docs/data/docker-tags/*.yaml:
#   releases: a list of ROCm releases (newest first), each with a unique
#     `rocm_ver` and a list of `variants` (framework versions). Each variant
#     has a `version` (the display string used in prose, alias names, and
#     the `tensorflow-ver` selector value) and a `tags` map of
#     dimension-key -> Docker tag. TensorFlow splits by Ubuntu release
#     (`ub24` / `ub22`); a variant with only `ub24` renders a single
#     code-block, one with both renders an Ubuntu tab-set.
#
#   `display_version` overrides the prose/heading version string when it
#   differs from the `version` selector value (for example "2.19" vs. the
#   published "2.19.1").
#
#   `version_selector_key` is the `:key:` of this page's `.. selector::`
#   block for the framework-version selector (docs/frameworks/tensorflow/
#   install.rst), used to render each variant's `.. selected:: <key>=...`.
#
#   `name` is the display name used in generated prose (for example,
#   "Pull the ROCm <name> <version> Docker image.").
#
#   `layout` ("flat" here) and `dimensions` (the ordered Ubuntu-version
#   tab list) are consumed by the shared
#   docs/templates/framework-version-docker.rst.jinja template -- see
#   that file's header comment for what each value means.
name: TensorFlow
version_selector_key: tensorflow-ver
layout: flat
dimensions:
  - key: ub24
    label: "Ubuntu 24.04"
  - key: ub22
    label: "Ubuntu 22.04"
releases:
