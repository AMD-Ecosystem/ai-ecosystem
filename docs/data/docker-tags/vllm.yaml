#
# Schema shared across docs/data/docker-tags/*.yaml:
#   releases: a list of ROCm releases (newest first), each with a unique
#     `rocm_ver` and a list of `variants` (framework versions -- vLLM only
#     ever has one per release). Each variant has a `vllm_release` (the
#     full version, used to derive doc links and prose) and a `tags` map of
#     dimension-key -> Docker tag.
#
#   A variant is "unified" (one `default` tag, no fam= branching in the
#   rendered RST) or "split" (separate `cdna` (AMD Instinct) and `rdna`
#   (AMD Radeon/Ryzen) tags, rendering `fam=instinct` / `fam=radeon
#   fam=ryzen` blocks).
#
#   `name` is the display name used in generated prose (for example,
#   "Pull the ROCm <name> <version> Docker image.").
